[package]
name = "ekphos"
version = "0.50.20"
edition = "2021"
rust-version = "1.90"
authors = ["Ekphos Contributors"]
description = "A lightweight, fast, terminal-based markdown research tool inspired by Obsidian"
license = "MIT"
repository = "https://github.com/nostacks/ekphos"
keywords = ["markdown", "tui", "terminal", "notes", "obsidian"]
categories = ["command-line-utilities", "text-editors"]
readme = "README.md"

[dependencies]
ratatui = "=0.30.1"
crossterm = "0.29"
image = { version = "0.25", default-features = false, features = ["avif", "bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "rayon", "tga", "tiff", "webp"] }
ratatui-image = { version = "=11.0.6", default-features = false, features = ["crossterm"] }
ratex-layout = "=0.1.14"
ratex-parser = "=0.1.14"
ratex-render = { version = "=0.1.14", features = ["embed-fonts"] }
ratex-types = "=0.1.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dirs = "5.0"
ureq = "2.9"
syntect = { version = "5.2", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
unicode-width = "0.2"
unicode-segmentation = "1.12"
regex = "1"
htmd = "=0.5.0"
serde_yaml = "0.9"
bincode = "1.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
memmap2 = "0.9"

[target.'cfg(not(target_os = "android"))'.dependencies]
clipboard-rs = { version = "0.3", default-features = false, features = ["image", "wayland"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(windows))'.dependencies]
tikv-jemallocator = { version = "=0.7.0", default-features = false }
tikv-jemalloc-sys = { version = "=0.7.1", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 16
